<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Meal Planner</title>
<style>
 body{font-family:system-ui,sans-serif;background:#fbf7f1;margin:0;color:#2b2b2b}
 nav{background:#c4531c;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
 nav a,nav button{color:#fff;margin-left:14px;text-decoration:none;background:none;border:0;font-size:1em;cursor:pointer}
 main{max-width:900px;margin:22px auto;padding:0 14px}
 .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
 .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
 .btn{padding:7px 14px;border-radius:8px;border:0;background:#c4531c;color:#fff;cursor:pointer;text-decoration:none;font-size:.9em;display:inline-block}
 .btn.green{background:#2e8b57}.btn.gray{background:#888}.btn.red{background:#c0392b}.btn.sm{padding:3px 8px;font-size:.75em}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0002}
 th,td{padding:8px;border-bottom:1px solid #eee;vertical-align:top;text-align:left;font-size:.85em}
 th{background:#f3e3d3}
 tr.today td:first-child{background:#fff1c9}
 .meal{background:#fde8d8;border-radius:6px;padding:4px 6px;margin-bottom:4px;display:flex;justify-content:space-between;gap:4px}
 .meal form{display:inline}.meal button{border:0;background:none;color:#c0392b;cursor:pointer}
 .add{color:#aaa;text-decoration:none;font-size:.8em}
 .meta{color:#777;font-size:.85em}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
 input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit;width:100%;box-sizing:border-box}
 .box{background:#fff;padding:20px;border-radius:12px;max-width:560px;margin:auto}
 .scroll{overflow-x:auto}
 .ing td{padding:4px}
 li{margin-bottom:4px}
</style></head><body>
<nav><strong>🍽️ Meal Planner</strong><span>
{% if user.is_authenticated %}<a href="{% url 'planner' %}">Planner</a><a href="{% url 'recipe_list' %}">Recipes</a><a href="{% url 'shopping_list' %}">Shopping list</a>
<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Logout ({{ user.username }})</button></form>
{% else %}<a href="{% url 'login' %}">Login</a><a href="{% url 'signup' %}">Sign up</a>{% endif %}
</span></nav>
<main>{% block content %}{% endblock %}</main>
</body></html>
